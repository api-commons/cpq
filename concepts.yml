context: cpq
name: Configure, Price, Quote
intro: >-
  The common CPQ vocabulary -- the sales quotes reps build, the line items priced on them and the
  price books those prices come from -- distilled from the APIs that already exist. Products
  belong to commerce, deals to CRM and invoices to billing.
tags: [CPQ, Configure Price Quote, Quoting, Sales Quotes, Proposals, Quote Management, Revenue Operations]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, quote_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, quote_status, stage, approval_status]
  name: [title, display_name, label, quote_name]
  currency: [currency_code, currency_iso_code]

concepts:
  sales_quote:
    path: /sales-quotes
    segments: [quotes, quote, sales_quotes, proposals, proposal, estimates@sales]
    aliases:
      number: [quote_number, reference, document_number]
      total: [grand_total, total_amount, amount, net_total, total_price]
      subtotal: [sub_total, subtotal_amount]
      discount: [discount_amount, total_discount, discount_percent]
      expires_at: [expiration_date, valid_until, expiry_date, expires]
      deal_id: [deal, opportunity_id, opportunity]
      account_id: [account, company_id, customer_id, customer]
      owner_id: [owner, created_by, sales_rep, user_id]
  # quote_line and price_book were measured and dropped: 2 and 1 readable providers.

duplicates:
  knownwell: [2x]

findings:
  - "A sales quote agrees only on id and status: total, discount, expiry and the deal it belongs to
    are each carried by a minority. Quotes are built inside CRM and CPQ suites and exposed as
    documents more than as structured records."
  - "Quote lines and price books are almost never resources in published APIs (2 and 1
    providers)."
decisions:
  - "Quotes are `/sales-quotes`: insurance and market data own `/quotes`. Proposals count."
  - "Products are commerce's, deals CRM's, and invoices billing's."
  - "Quote lines and price books were measured and dropped."
